<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Convol 適職タイプ診断</title>
<style>
  :root {
    --ink: #111111;
    --sub: #5b5b5b;
    --line: #e7e2d6;
    --paper: #fffdf7;
    --bg: #111111;
    --yellow: #f2e6a2;
    --pink: #f6c9cf;
    --mint: #bcebe5;
    --green: #6fcaa8;
    --red: #d7141a;
    --accent: #f2e6a2;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  #app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--paper); position: relative; }
  .brand { background: var(--bg); color: #fff; text-align: center; padding: 14px 0 12px; font-family: Georgia, "Times New Roman", serif; font-size: 22px; letter-spacing: .12em; }
  .demo { background: var(--red); color: #fff; font-size: 12px; padding: 6px 16px; text-align: center; }
  .screen { display: none; padding: 24px 20px 40px; }
  .screen.active { display: block; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* スタート */
  .hero { background: var(--mint); border-radius: 18px; padding: 28px 20px; text-align: center; position: relative; overflow: hidden; }
  .hero .ribbon { position: absolute; top: 14px; left: -34px; transform: rotate(-35deg); background: var(--red); color: #fff; font-size: 11px; font-weight: 800; padding: 3px 40px; }
  .title { font-size: 28px; font-weight: 900; line-height: 1.35; margin: 12px 0 8px; text-shadow: 2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff; }
  .subtitle { font-weight: 700; font-size: 15px; margin: 0; }
  .lead { font-size: 14px; margin: 20px 4px 0; }
  .note { font-size: 12px; color: var(--sub); margin: 14px 4px 0; }

  .btn { display: block; width: 100%; border: 2px solid var(--ink); background: var(--ink); color: #fff; font-size: 16px; font-weight: 800; padding: 15px 16px; border-radius: 999px; cursor: pointer; text-align: center; text-decoration: none; font-family: inherit; }
  .btn:active { transform: translateY(1px); }
  .btn.ghost { background: #fff; color: var(--ink); }
  .btn.small { font-size: 13px; padding: 9px 14px; width: auto; display: inline-block; }
  .btn + .btn { margin-top: 12px; }
  .mt { margin-top: 24px; }

  /* 設問 */
  .progress { height: 8px; background: #eee6cf; border-radius: 99px; overflow: hidden; }
  .progress > div { height: 100%; width: 0; background: var(--green); transition: width .3s ease; }
  .counter { font-size: 13px; font-weight: 800; color: var(--sub); margin: 10px 0 4px; }
  .question { font-size: 21px; font-weight: 900; line-height: 1.5; margin: 0 0 20px; min-height: 64px; }
  .options { display: grid; gap: 12px; }
  .option { text-align: left; border: 2px solid var(--ink); background: #fff; border-radius: 14px; padding: 14px 16px; font-size: 15px; font-weight: 700; font-family: inherit; color: var(--ink); cursor: pointer; box-shadow: 3px 3px 0 var(--ink); }
  .option:active, .option.picked { background: var(--yellow); transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  .back { background: none; border: none; color: var(--sub); font-size: 13px; margin-top: 22px; cursor: pointer; font-family: inherit; padding: 6px 0; }

  /* 判定中 */
  .center { text-align: center; padding-top: 80px; }
  .spinner { width: 42px; height: 42px; border: 4px solid #eee6cf; border-top-color: var(--ink); border-radius: 50%; margin: 0 auto 18px; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 結果 */
  .result-hero { border-radius: 18px; padding: 26px 20px; text-align: center; border: 2px solid var(--ink); }
  .result-hero .pre { font-size: 13px; font-weight: 800; margin: 0; }
  .result-hero .tname { font-size: 30px; font-weight: 900; line-height: 1.3; margin: 6px 0 10px; text-shadow: 2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff; }
  .result-hero .catch { font-size: 15px; font-weight: 700; margin: 0; }
  .result-hero .bubble { display: inline-block; margin-top: 14px; background: #fff; border: 2px solid var(--ink); border-radius: 999px; padding: 4px 14px; font-size: 13px; font-weight: 800; }
  .result-hero img { width: 100%; border-radius: 12px; margin-top: 14px; display: block; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-top: 16px; }
  .card h3 { font-size: 15px; font-weight: 900; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  .card h3::before { content: ""; width: 6px; height: 18px; border-radius: 3px; background: var(--accent); border: 1px solid var(--ink); }
  .card p { margin: 0; font-size: 14px; }
  .card ul { margin: 0; padding-left: 1.2em; font-size: 14px; }
  .card li + li { margin-top: 4px; }
  .pr { background: var(--paper); border: 1px dashed #c9c1a8; border-radius: 10px; padding: 12px; font-size: 14px; }
  .job { font-size: 18px; font-weight: 900; margin-bottom: 6px !important; }
  details { margin-top: 12px; font-size: 14px; }
  summary { cursor: pointer; font-weight: 800; }
  .day { white-space: pre-line; margin-top: 8px; padding-left: 4px; color: #333; }
  .senior { font-weight: 900; }
  .motive { background: var(--accent); border: 2px solid var(--ink); }
  .motive h3::before { background: #fff; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 10px; }
  .links { text-align: center; margin-top: 18px; font-size: 13px; }
  .links a, .links button { color: var(--sub); background: none; border: none; font-family: inherit; font-size: 13px; text-decoration: underline; cursor: pointer; margin: 0 8px; }
  .footnote { font-size: 11px; color: var(--sub); margin-top: 20px; text-align: center; }

  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 13px; opacity: 0; pointer-events: none; transition: all .25s ease; z-index: 10; max-width: 90%; text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">
  <div class="brand">Convol</div>
  <div class="demo" id="demo-banner" hidden>デモ表示中（LINE連携なし・結果は記録されません）</div>

  <section class="screen active" id="screen-loading">
    <div class="center"><div class="spinner"></div><p>読み込み中…</p></div>
  </section>

  <section class="screen" id="screen-start">
    <div class="hero">
      <div class="ribbon">毎月更新</div>
      <h1 class="title" id="start-title"></h1>
      <p class="subtitle" id="start-subtitle"></p>
    </div>
    <p class="lead" id="start-lead"></p>
    <button class="btn mt" id="btn-start" type="button">診断をはじめる</button>
    <p class="note" id="start-note"></p>
  </section>

  <section class="screen" id="screen-question">
    <div class="progress"><div id="progress-bar"></div></div>
    <p class="counter" id="q-counter"></p>
    <h2 class="question" id="q-text"></h2>
    <div class="options" id="q-options"></div>
    <button class="back" id="btn-back" type="button">← 前の質問にもどる</button>
  </section>

  <section class="screen" id="screen-judging">
    <div class="center"><div class="spinner"></div><p><b>あなたのタイプを診断中…</b></p></div>
  </section>

  <section class="screen" id="screen-result">
    <div id="result"></div>
  </section>

  <section class="screen" id="screen-error">
    <div class="center">
      <p><b>読み込みに失敗しました</b></p>
      <p class="note" id="error-detail"></p>
      <button class="btn mt" type="button" onclick="location.reload()">もう一度読み込む</button>
    </div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
/* 本体が動かなかったときに「読み込み中…」のまま止まらないようにする見張り役 */
(function () {
  function fail(msg) {
    var load = document.getElementById('screen-loading');
    if (!load || !load.classList.contains('active')) return;
    load.classList.remove('active');
    document.getElementById('screen-error').classList.add('active');
    document.getElementById('error-detail').textContent = msg;
  }
  window.addEventListener('error', function (e) {
    fail('プログラムの書き方に誤りがあります（' + (e.message || '不明なエラー') + '）。index.html の CONFIG の行で、引用符 \' \' やカンマが消えていないか、全角文字が混ざっていないか確認してください。');
  });
  setTimeout(function () {
    fail('読み込みに時間がかかっています。LINEアプリのリッチメニューから開き直してください。');
  }, 15000);
})();
</script>

  demo: false,
  inLine: false,
  liffReady: false,
  profile: { userId: '', displayName: '' },
  source: '',
  index: 0,
  answers: [],
  result: null,
};

/* ---------- 起動 ---------- */
init();

async function init() {
  const params = new URLSearchParams(location.search);
  state.source = params.get('src') || '';
  state.demo = !CONFIG.LIFF_ID || !CONFIG.GAS_URL || params.get('demo') === '1' || location.protocol === 'file:';

  try {
    if (state.demo) {
      const banner = document.getElementById('demo-banner');
      banner.hidden = false;
      if (location.protocol === 'file:' && CONFIG.LIFF_ID) banner.textContent = 'パソコンで直接開いたためデモ表示中（LINE連携はSTEP4の公開後に動きます）';
      state.cfg = SAMPLE;
    } else {
      await loadScript('https://static.line-scdn.net/liff/edge/2/sdk.js');
      await liff.init({ liffId: CONFIG.LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
      state.liffReady = true;
      state.inLine = liff.isInClient();
      try { state.profile = await liff.getProfile(); } catch (e) { /* 取得できなくても診断は続行 */ }
      state.source = new URLSearchParams(location.search).get('src') || state.source;
      const res = await fetch(CONFIG.GAS_URL + '?action=config');
      state.cfg = await res.json();
      if (!state.cfg || !state.cfg.ok) throw new Error('設定の読み込みに失敗しました');
    }
    renderStart();
  } catch (err) {
    document.getElementById('error-detail').textContent = String(err && err.message || err);
    show('screen-error');
  }
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.onload = resolve; s.onerror = () => reject(new Error('LINEの読み込みに失敗しました'));
    document.head.appendChild(s);
  });
}

/* ---------- 画面 ---------- */
function show(id) {
  document.querySelectorAll('.screen').forEach(el => el.classList.toggle('active', el.id === id));
  window.scrollTo(0, 0);
}

function setting(key, fallback) {
  const v = state.cfg.settings && state.cfg.settings[key];
  return (v === undefined || v === null || v === '') ? (fallback || '') : String(v);
}

function renderStart() {
  document.getElementById('start-title').textContent = setting('diagnosis_title', '適職タイプ診断');
  document.getElementById('start-subtitle').textContent = setting('diagnosis_subtitle');
  document.getElementById('start-lead').textContent = setting('start_lead');
  document.getElementById('start-note').textContent = setting('intro_note');
  document.getElementById('btn-start').onclick = () => { state.index = 0; state.answers = []; renderQuestion(); };
  show('screen-start');
}

function renderQuestion() {
  const qs = state.cfg.questions;
  const q = qs[state.index];
  document.getElementById('progress-bar').style.width = (state.index / qs.length * 100) + '%';
  document.getElementById('q-counter').textContent = 'Q' + (state.index + 1) + ' / ' + qs.length;
  document.getElementById('q-text').textContent = q.text;

  const box = document.getElementById('q-options');
  box.innerHTML = '';
  const options = q.kind === 'type' ? shuffle(q.options.slice()) : q.options;
  options.forEach(opt => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'option';
    b.textContent = opt.label;
    b.onclick = () => {
      b.classList.add('picked');
      state.answers[state.index] = opt;
      setTimeout(next, 180);
    };
    box.appendChild(b);
  });
  document.getElementById('btn-back').style.visibility = state.index === 0 ? 'hidden' : 'visible';
  document.getElementById('btn-back').onclick = () => { state.index--; renderQuestion(); };
  show('screen-question');
}

function next() {
  if (state.index < state.cfg.questions.length - 1) {
    state.index++;
    renderQuestion();
  } else {
    document.getElementById('progress-bar').style.width = '100%';
    show('screen-judging');
    setTimeout(finish, 1200);
  }
}

/* ---------- 判定 ---------- */
function judge() {
  const qs = state.cfg.questions;
  const counts = {};
  state.cfg.types.forEach(t => { counts[t.code] = 0; });
  let tieBreak = '', motive = '', status = '';
  qs.forEach((q, i) => {
    const a = state.answers[i];
    if (!a) return;
    if (q.kind === 'type') {
      counts[a.value] = (counts[a.value] || 0) + 1;
      if (q.no === 'Q6') tieBreak = a.value;
    } else if (q.kind === 'motive') {
      motive = a.value;
    } else if (q.kind === 'status') {
      status = a.label;
    }
  });
  const max = Math.max.apply(null, Object.values(counts));
  const top = state.cfg.types.filter(t => counts[t.code] === max);
  const type = top.find(t => t.code === tieBreak) || top[0];
  const motiveObj = state.cfg.motives.find(m => m.code === motive) || null;
  return { type, motive: motiveObj, statusLabel: status, counts };
}

async function finish() {
  state.result = judge();
  renderResult();
  log('診断完了');
  if (state.inLine && setting('send_result_to_chat').toUpperCase() === 'TRUE' && state.result.type.lineText) {
    try { await liff.sendMessages([{ type: 'text', text: state.result.type.lineText }]); } catch (e) { /* 送信できなくても結果表示は続ける */ }
  }
}

/* ---------- 結果画面 ---------- */
function renderResult() {
  const { type, motive } = state.result;
  const root = document.getElementById('result');
  root.innerHTML = '';
  const color = TYPE_COLORS[type.code] || 'var(--yellow)';
  document.documentElement.style.setProperty('--accent', color);

  const hero = el('div', 'result-hero');
  hero.style.background = color;
  hero.append(el('p', 'pre', 'あなたは…'), el('div', 'tname', type.name), el('p', 'catch', type.catch));
  hero.append(el('div', 'bubble', '君ならConvolについて来れる！'));
  if (isUrl(type.image)) { const img = document.createElement('img'); img.src = type.image; img.alt = type.name; hero.append(img); }
  root.append(hero);

  if (type.strengths && type.strengths.length) {
    const c = card('あなたの強み');
    const ul = document.createElement('ul');
    type.strengths.forEach(s => ul.append(el('li', '', s)));
    c.append(ul); root.append(c);
  }

  if (type.pr) {
    const c = card('そのまま使える自己PR文');
    c.append(el('p', 'pr', type.pr));
    const row = el('div', 'row');
    row.append(el('span', 'note', '履歴書や面接でそのまま使えます'));
    const copy = el('button', 'btn small ghost', 'コピーする');
    copy.type = 'button';
    copy.onclick = () => copyText(type.pr).then(() => toast('自己PR文をコピーしました'));
    row.append(copy); c.append(row); root.append(c);
  }

  if (type.job) {
    const c = card('向いているConvolの仕事');
    c.append(el('p', 'job', type.job));
    if (type.jobdesc) c.append(el('p', '', type.jobdesc));
    if (type.day) {
      const d = document.createElement('details');
      d.append(el('summary', '', '1日の流れ（例）を見る'), el('div', 'day', type.day));
      c.append(d);
    }
    root.append(c);
  }

  if (type.senior || type.seniorComment) {
    const c = card('同じタイプの先輩');
    if (type.senior) c.append(el('p', 'senior', type.senior));
    if (type.seniorComment) c.append(el('p', '', type.seniorComment));
    if (isUrl(type.video)) {
      const a = el('a', 'btn small ghost', '先輩が出ている動画を見る');
      a.href = type.video; a.style.marginTop = '12px';
      a.onclick = (e) => { e.preventDefault(); openUrl(type.video); };
      c.append(a);
    }
    root.append(c);
  }

  if (type.career) {
    const c = card('このタイプのキャリア例');
    c.append(el('p', '', type.career));
    root.append(c);
  }

  if (motive && motive.message) {
    const c = card('「' + motive.label + '」あなたへ');
    c.classList.add('motive');
    c.append(el('p', '', motive.message));
    root.append(c);
  }

  const cta = el('div', 'mt');
  const main = el('button', 'btn', setting('interview_button', 'このタイプの先輩と15分話してみる'));
  main.type = 'button'; main.onclick = onInterview;
  const share = el('button', 'btn ghost', '友達にもシェアする');
  share.type = 'button'; share.onclick = onShare;
  cta.append(main, share);
  root.append(cta);

  const links = el('div', 'links');
  if (isUrl(setting('recruit_url'))) {
    const a = el('a', '', '募集ポジションを見る');
    a.href = setting('recruit_url');
    a.onclick = (e) => { e.preventDefault(); openUrl(setting('recruit_url')); };
    links.append(a);
  }
  const again = el('button', '', 'もう一度診断する');
  again.type = 'button'; again.onclick = () => { state.index = 0; state.answers = []; renderQuestion(); };
  links.append(again);
  root.append(links);

  root.append(el('p', 'footnote', '※この診断は楽しむためのものです。結果を選考の合否に使うことはありません。'));
  show('screen-result');
}

/* ---------- ボタンの動作 ---------- */
async function onInterview() {
  log('面談ボタン');
  const url = setting('interview_url');
  if (isUrl(url)) { openUrl(url); return; }
  if (state.inLine) {
    try {
      await liff.sendMessages([{ type: 'text', text: setting('interview_message', 'カジュアル面談を希望します') }]);
      toast('トークに送信しました。担当者からご連絡します');
      setTimeout(() => liff.closeWindow(), 1200);
    } catch (e) { toast('送信できませんでした。トーク画面からご連絡ください'); }
  } else {
    toast(state.demo ? 'デモ：LINEアプリ内では「' + setting('interview_message', 'カジュアル面談を希望します') + '」がトークに送られます' : 'LINEアプリから開くと面談のお申し込みができます');
  }
}

async function onShare() {
  log('シェアボタン');
  const typeName = state.result.type.name;
  const link = CONFIG.LIFF_ID ? 'https://liff.line.me/' + CONFIG.LIFF_ID + '?src=share' : location.href;
  const text = setting('share_text', 'Convolの適職タイプ診断、私は「{type}」だった！').replace('{type}', typeName) + '\n' + link;
  try {
    if (state.liffReady && liff.isApiAvailable('shareTargetPicker')) {
      await liff.shareTargetPicker([{ type: 'text', text }]);
      return;
    }
    if (navigator.share) { await navigator.share({ text }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; /* 使えない環境ではコピーに切り替え */ }
  await copyText(text);
  toast('シェア用の文章をコピーしました');
}

/* ---------- 記録 ---------- */
function log(event) {
  if (state.demo || !CONFIG.GAS_URL || !state.result) return;
  const r = state.result;
  const body = {
    event,
    userId: state.profile.userId || '',
    displayName: state.profile.displayName || '',
    typeName: r.type.name,
    motiveLabel: r.motive ? r.motive.label : '',
    statusLabel: r.statusLabel,
    answers: state.cfg.questions.map((q, i) => q.no + ':' + (state.answers[i] ? state.answers[i].label : '')),
    source: state.source,
  };
  fetch(CONFIG.GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body),
    keepalive: true,
  }).catch(() => {});
}

/* ---------- 小物 ---------- */
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function card(title) { const c = el('div', 'card'); c.append(el('h3', '', title)); return c; }
function isUrl(v) { return /^https?:\/\//i.test(String(v || '')); }
function openUrl(url) {
  if (state.liffReady) liff.openWindow({ url, external: false });
  else window.open(url, '_blank', 'noopener');
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return; } catch (e) { /* 下の方法で再試行 */ }
  const t = document.createElement('textarea');
  t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
  document.body.append(t); t.select();
  try { document.execCommand('copy'); } catch (e) { /* 何もしない */ }
  t.remove();
}
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}
</script>
</body>
